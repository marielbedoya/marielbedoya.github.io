works:
- title: "The Making of a Public Sector Worker: The Causal Effects of Temporary Work Assignments to Poor Areas"
  pdflink: "/pdf/AgteBedoya_JMP.pdf"
  coauthors: "Patrick Agte"
  # "note" shows a line under the coauthors. Replace this with the draft's
  # details once the PDF is posted, or delete it.
  # note: "Draft available upon request"
  abstract: >
    Can a temporary policy intervention permanently change where people choose to 
    work?  We study this question using Peru's mandatory rural service program, 
    which assigns health professionals to posts across the country for one year. 
    We exploit exogenous variation from a lottery system determining psychology 
    graduates' service assignments. Using administrative data and an original 
    survey, we find that psychologists assigned to poorer locations are 
    significantly more likely to subsequently work in the public sector (17%) 
    and poorest districts (54%) up to three years after the program. We then 
    present evidence that the experience changes worker preferences and beliefs. 
    Psychologists assigned to poorer areas score 0.11 standard deviations higher on
    a prosociality index, and report greater willingness to work serving the poor: 
    both geographically and by type of employer (Ministry of Health facilities). 
    We rule out inertia, differential skill formation, and network effects as 
    alternative explanations. These findings demonstrate the potential of 
    preference endogeneity, not just financial incentives, to attract workers to 
    underserved areas. 