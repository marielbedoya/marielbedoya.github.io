works:
- title: "The Making of a Public Sector Worker: The Causal Effects of Temporary Work Assignments to Poor Areas"
  # Add the draft PDF at static/pdf/ and uncomment the line below:
  # pdflink: "/pdf/Bedoya_JMP.pdf"
  coauthors: "Patrick Agte"
  # "note" shows a line under the coauthors. Replace this with the draft's
  # details once the PDF is posted, or delete it.
  note: "Draft available upon request"
  abstract: >
    The global shortage of health workers in remote and underserved areas remains a critical
    policy challenge. Over 70 countries have implemented temporary service programs to address
    geographic imbalances in health worker distribution. This paper examines whether temporary
    work assignments to poor rural areas affect long-term career choices using Peru's mandatory
    rural service program. We exploit exogenous variation in the available choice set of
    facilities generated by a lottery system determining the order in which psychologists choose
    service locations. Using administrative data and an original survey of 709 psychologists who
    completed the program, we find that those assigned to poorer locations through later lottery
    draws are significantly more likely to subsequently work in the public sector (17%) and
    poorest districts (59%) up to three years after the program. We investigate mechanisms and
    find evidence that the experience changes worker preferences and beliefs. Psychologists
    assigned to poorer areas score 0.12 standard deviations higher on a prosociality index, are
    more willing to accept jobs in poor areas in hypothetical scenarios, and report increased
    willingness to work for public facilities serving the poor. We rule out inertia, differential
    skill formation, and network effects. These findings demonstrate that governments can leverage
    preference endogeneity, not just financial incentives, to attract workers to underserved areas.
